[Haptics]
; pulse frequency (cycles per second)
; doesn't seem to make any difference on my setup
fFrequency = 200.0
; pulse amplitude (between 0 and 1)
fMinAmplitude = 0
; since Skyrim doesn't know about frequencies and amplitudes (unavailable in legacy OpenVR API), it emulates stronger effects with higher durations (apparently capped at 3999us)
; we can make it more interesting by adding some amplitude based on those durations. the final amplitude is calculated as "fMinAmplitude + (duration / 3999) * fAddedDurationAmplitudeScale", clamped between 0 and 1
fAddedDurationAmplitudeScale = 1.0

[Fingers]
; drive VRIK finger curling from SteamVR skeletal input
bEnableVrikFingerTracking = 0

[Debug]
; logging verbosity level (trace, debug, info, warning, error, critical, off)
sLogLevel = info
